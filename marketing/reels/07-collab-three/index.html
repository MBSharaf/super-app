<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel 07 — Collab: ماتش واحد، 3 حكايات</title>
<!-- Super App reel 07 (Instagram Collab reel) · co-posted by Super App + a pitch + a captain/creator + a tee brand ·
     1080×1920 · 18 s · collage on ink. Voiceover (Egyptian Arabic) with burned-in subtitles.
     Partner handles: edit PARTNERS below (or pass ?pitch=&creator=&brand= when previewing), then re-render. -->
<link rel="stylesheet" href="../_kit/reel.css">
<style>
  .who-pill { z-index: 30; height: 84px; padding: 0 34px 6px; border-radius: 999px; background: var(--surface); color: var(--ink); font: 800 40px "Cairo", "Archivo", sans-serif; display: flex; align-items: center; gap: 14px; box-shadow: 0 14px 22px -12px rgba(0,0,0,.6); white-space: nowrap; }
  .who-pill i { width: 18px; height: 18px; border-radius: 50%; background: var(--blaze); display: block; }
  #collab { left: 60px; right: 60px; top: 1000px; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 14px; }
  #collab .who-pill { height: 70px; font-size: 32px; padding: 0 26px 4px; }
  #collab .x { color: #fff; font: 800 40px "Archivo", sans-serif; align-self: center; }
  #pitch { left: 90px; top: 450px; width: 900px; height: 580px; z-index: 10; }
  #booked { left: 140px; top: 900px; z-index: 20; }
  #phone { left: 290px; top: 420px; width: 500px; height: 700px; z-index: 10; }
  #paid { left: 60px; top: 820px; z-index: 20; }
  #paid .stampbox { width: 330px; height: 330px; border-radius: 50%; border: 14px dashed var(--turf); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--turf); box-shadow: 0 24px 30px -16px rgba(0,0,0,.6); }
  #paid b { font: 800 104px "Archivo", sans-serif; line-height: 1; direction: ltr; }
  #paid span { font-size: 40px; font-weight: 800; }
  #halo { left: 190px; top: 470px; width: 700px; height: 700px; border-radius: 50%; background: var(--blaze); }
  #tee { left: 230px; top: 430px; width: 620px; z-index: 10; filter: drop-shadow(0 30px 30px rgba(0,0,0,.5)); }
  .chk { z-index: 20; }
  #hub { left: 390px; top: 600px; z-index: 12; }
  #sub span { background: var(--surface); color: var(--ink); }
  .p-pitch { right: 60px; top: 400px; } .p-creator { right: 60px; top: 400px; } .p-brand { right: 60px; top: 400px; }
</style>
</head>
<body>
<div class="abs halftone"></div>
<div class="abs tag"><i></i>Collab · ماتش خماسي</div>

<div class="abs stack" id="hook" style="top:500px">
  <span class="block b-paper hw" style="font-size:140px">ماتش واحد</span>
  <span class="block b-blaze hw" style="font-size:150px;margin-inline-start:80px">3 حكايات</span>
</div>
<div class="abs" id="collab"></div>

<!-- 1 · the pitch -->
<div class="abs" id="pitch"><svg width="900" height="580" viewBox="0 0 900 580">
  <rect x="10" y="10" width="880" height="560" rx="18" fill="#0B6E4F" stroke="#fff" stroke-width="10"/>
  <g fill="none" stroke="#fff" stroke-width="7" opacity=".9"><path d="M450 10V570"/><circle cx="450" cy="290" r="80"/><rect x="10" y="170" width="110" height="240"/><rect x="780" y="170" width="110" height="240"/></g>
  <g fill="rgba(255,255,255,.08)"><rect x="10" y="10" width="110" height="560"/><rect x="230" y="10" width="110" height="560"/><rect x="560" y="10" width="110" height="560"/><rect x="780" y="10" width="110" height="560"/></g>
  <circle cx="450" cy="290" r="18" fill="#fff"/>
</svg></div>
<div class="abs" id="booked"><div class="toast"><span class="ic" style="background:var(--turf)"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span><span><b>اتأكد الحجز</b><span>الخميس · 9 م · ساعة</span></span></div></div>

<!-- 2 · the crew pays -->
<div class="abs phone" id="phone"><div class="screen"><img src="assets/match.jpg" style="display:block"></div></div>
<div class="abs tape" id="tp" style="left:250px;top:404px;z-index:12;transform:rotate(-28deg)"></div>
<div class="abs" id="paid" style="transform:rotate(-10deg)"><div class="stampbox"><b>10/10</b><span>دفعوا نصيبهم</span></div></div>

<!-- 3 · the brand -->
<div class="abs" id="halo"></div>
<img class="abs" id="tee" src="assets/tee-3d.png" alt="">
<div class="abs chk" id="chk1" style="left:70px;top:620px"><span class="cta" style="background:var(--surface);color:var(--ink)">اتطبعت ✓</span></div>
<div class="abs chk" id="chk2" style="left:110px;top:780px"><span class="cta" style="background:var(--surface);color:var(--ink)">اتشحنت ✓</span></div>
<div class="abs chk" id="chk3" style="right:60px;top:1090px"><span class="cta" style="background:var(--turf)">من غير مخزن</span></div>

<!-- 4 · all in one place -->
<div class="abs" id="hub"><svg width="300" height="300" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#25322B"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg></div>

<!-- partner pills (one per partner, they move between scenes) -->
<div class="abs who-pill" id="pp" data-k="pitch"><i></i><span></span></div>
<div class="abs who-pill" id="pc" data-k="creator"><i></i><span></span></div>
<div class="abs who-pill" id="pb" data-k="brand"><i></i><span></span></div>

<div class="abs sub" id="sub"></div>

<div class="abs stack" id="end" style="top:460px">
  <span class="block b-paper ew" style="font-size:150px">تابعونا</span>
  <span class="block b-blaze ew" style="font-size:130px;margin-inline-start:60px">الإطلاق قرّب</span>
  <span class="note ew" style="font-size:46px;margin-top:10px">ملعب، ولاعيبة، وبراند… <mark>في مكان واحد</mark></span>
</div>
<div class="abs brand" id="brand" style="top:1060px"></div>

<svg class="abs grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .2 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
<script src="../_kit/reel.js"></script>
<script>
// the three collaborators: replace with their real Instagram handles before rendering the version to post
const q = new URLSearchParams(location.search);
const PARTNERS = { pitch: q.get('pitch') || '@اسم_الملعب', creator: q.get('creator') || '@اسم_الكابتن', brand: q.get('brand') || '@اسم_البراند' };
const LINES = [
  [0.2, 2.8, 'ماتش خماسي واحد… وتلات حكايات.'],
  [2.8, 5.6, 'الكابتن حجز <b>الملعب</b> من Super App.'],
  [5.6, 8.6, 'الشلة كلها دفعت <b>نصيبها</b> من الأبلكيشن.'],
  [8.6, 12.6, 'والتيشيرتات؟ <b>براند مصري</b>، اتطبعت واتشحنت من غير مخزن.'],
  [12.6, 15.4, 'ملعب، ولاعيبة، وبراند… كلهم في مكان واحد.'],
  [15.4, 17.8, 'تابعونا… الإطلاق قرّب.'],
];
const DUR = 18, B = { s1: 2.8, s2: 5.6, s3: 8.6, all: 12.6, end: 15.4 };
$$('.who-pill').forEach((el) => { el.querySelector('span').textContent = PARTNERS[el.dataset.k]; });
$('#collab').innerHTML = ['Super App', PARTNERS.pitch, PARTNERS.creator, PARTNERS.brand].map((h) => `<span class="who-pill cl"><i></i>${h}</span>`).join('<span class="x cl">×</span>');
const brand = $('#brand'); brand.innerHTML = `${MARK}<div class="wm">SUPER APP</div><div class="ln">قريب · كل الكورة في مكان واحد</div>`;
window.ready = Promise.all($$('img').map((im) => im.decode().catch(() => {})));

// a scene element: springs in at a, flies out at b
function scene(el, t, a, b, tf = (p, o) => `translateY(${(1 - p) * 500 + o * 300}px)`) {
  const p = spring(prog(t, a, .45)), o = ease(prog(t, b - .3, .3));
  show(el, t > a && t < b + .05 ? clamp(p * 3) * (1 - o) : 0, tf(p, o));
}
// a sticker: pops in at a, leaves with the scene at b
function sticker(el, t, a, b, tilt) {
  const p = spring(prog(t, a, .3)), o = ease(prog(t, b - .3, .3));
  show(el, t > a && t < b ? clamp(p * 3) * (1 - o) : 0, `rotate(${tilt + jit(tilt * 7, t, .8)}deg) scale(${lerp(1.7, 1, p)})`);
}

window.render = function (t) {
  // hook + the collab line-up
  const hookOut = prog(t, B.s1 - .25, .3);
  show($('#hook'), t < B.s1 + .1 ? 1 - hookOut : 0, `translateX(${-ease(hookOut) * 1100}px)`);
  popIn($$('.hw'), t, .05, [-2, 1.5], 0, .2);
  show($('#collab'), t < B.s1 + .1 ? 1 - hookOut : 0, `translateX(${-ease(hookOut) * 1100}px)`);
  $$('#collab .cl').forEach((el, i) => { const p = spring(prog(t, .7 + i * .12, .3)); el.style.opacity = clamp(p * 3); el.style.transform = `scale(${lerp(.4, 1, p)}) rotate(${jit(i + 40, t, 1.2)}deg)`; });

  // 1 · pitch booked
  scene($('#pitch'), t, B.s1, B.s2, (p, o) => `translate(${-o * 1100}px, ${(1 - p) * 400}px) rotate(${lerp(-8, -2, p) + jit(1, t, .3)}deg)`);
  sticker($('#booked'), t, B.s1 + .9, B.s2, 2);
  // 2 · the crew pays on the match page
  scene($('#phone'), t, B.s2, B.s3, (p, o) => `translate(${jit(2, t, 2)}px, ${(1 - p) * 700 + o * 500}px) rotate(${lerp(9, -3, p)}deg)`);
  show($('#tp'), $('#phone').style.display === 'none' ? 0 : +$('#phone').style.opacity);
  sticker($('#paid'), t, B.s2 + 1.2, B.s3, -10);
  // 3 · the brand's tee
  const h = ease(prog(t, B.s3 - .1, .4)), ho = ease(prog(t, B.all - .3, .3));
  show($('#halo'), t > B.s3 - .1 && t < B.all + .05 ? h * (1 - ho) : 0, `scale(${lerp(.2, 1, h) * (1 - .3 * ho)})`);
  scene($('#tee'), t, B.s3 + .1, B.all, (p, o) => `translateY(${(1 - p) * 500 + o * 200}px) rotate(${lerp(-12, 0, p) + Math.sin(t * 2.2) * 3}deg) scale(${lerp(.7, 1, p) * (1 - .5 * o)})`);
  sticker($('#chk1'), t, B.s3 + 1.4, B.all, -4); sticker($('#chk2'), t, B.s3 + 1.9, B.all, 3); sticker($('#chk3'), t, B.s3 + 2.5, B.all, -3);
  // 4 · everyone around one mark
  const hb = spring(prog(t, B.all + .05, .4)), hbo = ease(prog(t, B.end - .3, .3));
  show($('#hub'), t > B.all && t < B.end + .05 ? clamp(hb * 3) * (1 - hbo) : 0, `scale(${lerp(.3, 1, hb) * (1 - .4 * hbo)}) rotate(${jit(3, t, 1)}deg)`);

  // partner pills: each one leads its scene (top-right), then all three gather around the mark
  const home = { pitch: [B.s1 + .4, B.s2], creator: [B.s2 + .4, B.s3], brand: [B.s3 + .4, B.all] };
  const ring = { pitch: [600, 470], creator: [50, 940], brand: [560, 1010] };   // [right, top] around the mark
  $$('.who-pill[data-k]').forEach((el, i) => {
    const k = el.dataset.k, [a, b] = home[k];
    const inP = spring(prog(t, a, .35)), gather = spring(prog(t, B.all + .3 + i * .2, .45)), out = ease(prog(t, B.end - .3, .3));
    const solo = t > a && t < b, together = t > B.all + .3 + i * .2 && t < B.end + .05;
    const soloOut = ease(prog(t, b - .3, .3));
    if (together) { el.style.right = ring[k][0] + 'px'; el.style.top = ring[k][1] + 'px'; show(el, clamp(gather * 3) * (1 - out), `rotate(${[-4, 3, -2][i]}deg) scale(${lerp(.3, 1, gather)})`); }
    else { el.style.right = '60px'; el.style.top = '400px'; show(el, solo ? clamp(inP * 3) * (1 - soloOut) : 0, `rotate(${-3 + jit(i + 50, t, .8)}deg) scale(${lerp(1.7, 1, inP)})`); }
  });

  // end
  const endOn = t >= B.end;
  show($('#end'), endOn ? 1 : 0);
  popIn($$('.ew'), t, B.end + .05, [-2, 1.5, 1], 20);
  const br = ease(prog(t, B.end + .6, .4));
  show(brand, endOn ? br : 0, `translateY(${(1 - br) * 40}px)`);

  subtitles($('#sub'), LINES, t);
};
window.DURATION = DUR;
render(0);
</script>
</body>
</html>
