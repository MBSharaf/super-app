<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel 14 — موقع وتطبيق</title>
<!-- Super Malaab reel 14 · everyone · 13.6 s · reference style (typing like ref 2, laptop + phone). Desktop screens captured
     from supermalaab.com at 1440×900, phone screens at 390×844. Same account and bookings on both (one account system). -->
<link rel="stylesheet" href="../_app/app.css">
<style>
  #url { display: flex; align-items: center; gap: 22px; width: 900px; height: 130px; padding: 0 40px; border-radius: 999px; background: #fff; color: #0D1411;
    font: 700 62px "Archivo", sans-serif; direction: ltr; box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); }
  #url .caret { display: inline-block; width: 5px; height: 70px; background: #FF5B14; margin-left: 4px; }
  #url .go { margin-left: auto; width: 84px; height: 84px; border-radius: 50%; background: #FF5B14; display: grid; place-items: center; }
  #laptop { left: 90px; top: 560px; width: 900px; z-index: 19; transform-origin: 50% 50%; }
  #laptop .lid { background: #0B0F0D; border-radius: 34px 34px 0 0; padding: 20px 20px 26px; box-shadow: inset 0 0 0 3px #2B332F; }
  #laptop .lid .sc { position: relative; height: 537px; border-radius: 10px; overflow: hidden; background: #fff; }
  #laptop .lid .sc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  #laptop .base { height: 34px; margin: 0 -50px; background: linear-gradient(#C9CEC9, #9AA19C); border-radius: 0 0 30px 30px; box-shadow: 0 40px 60px -30px rgba(0,0,0,.6); }
  #laptop .base::before { content: ""; display: block; width: 160px; height: 12px; margin: 0 auto; border-radius: 0 0 12px 12px; background: #8C938E; }
</style>
</head>
<body>
<div class="abs" id="bg"></div><div class="abs" id="bg2"></div>

<div class="abs" id="hook"><div class="h2" style="font-size:80px;margin-bottom:40px">اكتب…</div>
  <div id="url"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2.4"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span id="typed"></span><span class="caret" id="caret"></span>
    <span class="go"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></div>
<div class="abs" id="title"></div>

<div class="abs" id="laptop"><div class="lid"><div class="sc"><img id="lap1" src="../_app/shots/desk-home.jpg"><img id="lap2" src="../_app/shots/desk-padel.jpg"></div></div><div class="base"></div></div>

<div class="abs" id="phone"><div class="scr">
  <img data-s="hf" class="full" src="../_app/shots/home-football.jpg">
  <img data-s="hp" class="full" src="../_app/shots/home-padel.jpg">
  <img data-s="fx" class="full" src="../_app/shots/fantasy.jpg">
  <div class="abs" id="tap"></div>
  <div class="island"></div>
</div></div>

<div class="abs" id="end"></div>
<script src="../_app/app.js"></script>
<script>
const URL = 'supermalaab.com';
const LAP = [[0, { y: 1500 }], [2.45, { y: 1500 }], [2.6, { y: 0, s: 1, d: .5 }], [3.85, { y: 0, s: 1 }], [4.0, { x: -1200, s: 1 }], [4.9, { x: -1200, y: -170, s: .62 }], [5.05, { x: -180, y: -170, s: .62, d: .5 }], [8.0, { x: -180, y: -170, s: .62 }], [8.25, { x: -1300, y: -170, s: .62 }]];
AppReel({
  dur: 13.6, vo: .15,
  hook: { until: 2.45 },
  lines: [
    [0, .39, ''], [.75, 2.09, ''], [2.63, 3.51, 'واحجز من اللابتوب…'], [3.91, 4.7, 'أو من الموبايل.'], [5.17, 5.83, 'نفس الحساب،'],
    [6.05, 8.05, 'ونفس حجوزاتك،<br>في أي مكان.'], [8.39, 10.15, 'كورة، وبادل، وفانتازي…'],
  ],
  scenes: [
    { t: 0, bg: '#0D1411', screen: 'hf' },
    { t: 2.45, bg: '#F1F2EE', fg: '#0D1411', screen: 'hf' },
    { t: 3.9, bg: '#0B6E4F', screen: 'hf' },
    { t: 5.05, bg: '#1F5FBF', screen: 'hp' },
    { t: 8.3, bg: '#FF5B14', screen: 'hf' },
    { t: 9.05, bg: '#FF5B14', screen: 'hp' },
    { t: 9.65, bg: '#FF5B14', screen: 'fx' },
  ],
  phone: [[0, { x: 1100 }], [3.6, { x: 1100 }], [3.9, { x: 0, s: 1, d: .45 }], [4.8, { x: 0, s: 1 }], [5.05, { x: 230, y: 170, s: .72, d: .5 }], [8.0, { x: 230, y: 170, s: .72 }], [8.3, { x: 0, y: 0, s: 1, d: .4 }]],
  end: { at: 10.55, line: 'نفس الحساب على الموقع والموبايل' },
  custom(t) {
    const n = Math.round(clamp((t - .8) / 1.2) * URL.length);
    $('#typed').textContent = URL.slice(0, n);
    $('#caret').style.opacity = Math.floor(t * 3) % 2 || n < URL.length ? 1 : 0;
    const l = track(LAP, t);
    $('#laptop').style.display = t > 2.4 && t < 8.6 ? '' : 'none';
    $('#laptop').style.transform = `translate(${l.x}px, ${l.y}px) scale(${l.s})`;
    $('#lap2').style.opacity = t >= 5.05 ? 1 : 0;
  },
});
</script>
</body>
</html>
