<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel covers</title>
<!-- Designed covers for every reel, one series look. Render with ?r=01..07 (covers.js renders all into each reel's cover.png).
     Everything that matters sits in the centre 1080×1350 (y 285–1635), so the profile grid's 4:5 / 3:4 crop keeps it. -->
<link rel="stylesheet" href="reel.css">
<style>
  .series { top: 300px; left: 60px; z-index: 50; height: 70px; padding: 0 26px; background: var(--cream); color: var(--ink); font: 800 32px "Archivo", sans-serif; letter-spacing: .08em; display: flex; align-items: center; direction: ltr; box-shadow: 0 8px 16px -10px rgba(0,0,0,.45); }
  .bg-cream .series { background: var(--ink); color: #fff; }
  .tag { top: 300px; }
  .title { right: 60px; left: 60px; top: 410px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; z-index: 30; }
  .art { z-index: 10; }
  .foot { left: 0; right: 0; top: 1560px; display: flex; justify-content: center; align-items: center; gap: 18px; z-index: 30; }
  .foot .wm { font: 800 34px Archivo, sans-serif; font-stretch: 125%; color: var(--fg); direction: ltr; }
  .print { background: #fff; padding: 16px; box-shadow: 0 30px 40px -22px rgba(0,0,0,.6); }
  .print img { display: block; width: 100%; }
  .circle { border-radius: 50%; overflow: hidden; box-shadow: 0 30px 40px -22px rgba(0,0,0,.6); border: 14px solid #fff; }
  .circle img { width: 100%; display: block; }
</style>
</head>
<body>
<div class="abs halftone" id="ht"></div>
<div class="abs tag"><i></i><span id="tagtx"></span></div>
<div class="abs series" id="series"></div>
<div id="c"></div>
<div class="abs foot" id="foot"></div>
<svg class="abs grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .18 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
<script src="reel.js"></script>
<script>
const R = '..';
const tile = (bg, fg, label, icon) => `<div class="tile" style="width:230px;height:230px;border-radius:56px;background:${bg};color:${fg};font-size:30px">${icon}${label}</div>`;
const COVERS = {
  '01': { bg: 'bg-cream', tag: 'ماتش خماسي', title: [['b-ink', 150, 'أنواع اللاعيبة'], ['b-blaze', 140, 'في الخماسي'], ['note', 54, 'وانت <mark>مين فيهم؟</mark> 😂']],
    art: `<div class="abs art circle" style="left:90px;top:900px;width:480px;height:480px;transform:rotate(-6deg)"><img src="${R}/01-khomasi-types/cover-art-10.png"></div>
          <div class="abs art circle" style="right:80px;top:960px;width:420px;height:420px;transform:rotate(5deg)"><img src="${R}/01-khomasi-types/cover-art-5.png"></div>
          <div class="abs tape" style="left:320px;top:900px;z-index:12;transform:rotate(-14deg)"></div>` },
  '02': { bg: '', tag: 'براند تيشيرتات', title: [['b-paper', 140, 'براند تيشيرتات'], ['b-blaze', 160, 'بـ 0 جنيه'], ['note', 50, 'من غير <mark>مخزن ولا مصنع</mark>']],
    art: `<div class="abs" style="left:250px;top:980px;width:580px;height:580px;border-radius:50%;background:var(--blaze)"></div>
          <img class="abs art" src="${R}/02-tee-3d/assets/tee-print.png" style="left:220px;top:860px;width:640px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.5))">` },
  '03': { bg: 'bg-turf', tag: 'فانتازي الدوري المصري', title: [['b-paper', 120, 'فانتازي المصري'], ['b-ink', 110, 'والإنجليزي'], ['b-blaze', 130, 'في حساب واحد']],
    art: `<div class="abs art phone" style="left:130px;top:990px;width:360px;height:520px;transform:rotate(-7deg)"><div class="screen"><img src="${R}/03-fantasy-two-leagues/assets/fx-egy.jpg" style="display:block"></div></div>
          <div class="abs art phone" style="right:130px;top:970px;width:360px;height:520px;transform:rotate(6deg)"><div class="screen"><img src="${R}/03-fantasy-two-leagues/assets/fx-epl.jpg" style="display:block"></div></div>` },
  '04': { bg: 'bg-cream', tag: 'ماتش خماسي', title: [['b-paper', 120, 'الماتش الساعة 9'], ['b-blaze', 130, 'وواحد اعتذر'], ['b-ink', 120, 'الساعة 8 😩']],
    art: `<div class="abs art" style="left:90px;right:90px;top:1060px;display:flex;flex-direction:column;gap:20px">
            <div class="bubble b-in" style="font-size:46px;transform:rotate(-2deg)"><span class="who">حسام</span>معلش يا رجالة مش هقدر آجي 🙏<small>8:02 م</small></div>
            <div class="bubble b-out" style="font-size:46px;transform:rotate(1.5deg)">يعني إيه؟؟ الماتش كمان ساعة<small>8:03 م</small></div></div>` },
  '05': { bg: '', tag: 'لأصحاب الملاعب', title: [['b-paper', 130, 'من الكراسة'], ['b-blaze', 140, 'للداشبورد'], ['note', 50, 'ملعبك <mark>أونلاين</mark> قبل الإطلاق']],
    art: `<div class="abs art laptop" style="left:60px;top:1000px;width:960px;transform:rotate(-2deg)"><img src="${R}/05-notebook-to-dashboard/assets/dash-availability.jpg" style="height:440px;object-fit:cover;object-position:top"></div>
          <div class="abs tape" style="left:30px;top:985px;z-index:12;transform:rotate(-30deg)"></div>` },
  '06': { bg: 'bg-cream', tag: 'كل الكورة في مكان واحد', title: [['b-paper', 140, '4 أبلكيشنات'], ['b-blaze', 100, 'عشان ماتش واحد؟'], ['note', 54, 'قولنا <mark>رأيك</mark> في الكومنتات 👇']],
    art: `<div class="abs art" style="left:110px;right:110px;top:1000px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;justify-items:center">
      ${tile('var(--turf)', '#fff', 'حجز', '<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.2"/></svg>').replace('230px;height:230px', '180px;height:180px')}
      ${tile('var(--ink)', '#fff', 'فانتازي', '<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M12 13v4M8 20h8"/></svg>').replace('230px;height:230px', '180px;height:180px')}
      ${tile('var(--surface)', 'var(--ink)', 'جداول', '<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#0D1411" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/></svg>').replace('230px;height:230px', '180px;height:180px')}
      ${tile('#D6EFDF', 'var(--ink)', 'فلوس', '<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#0D1411" stroke-width="1.6" stroke-linejoin="round"><path d="M4 18.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8z"/></svg>').replace('230px;height:230px', '180px;height:180px')}
    </div>
    <div class="abs art" style="left:0;right:0;top:1250px;display:flex;justify-content:center"><span class="cta" style="font-size:44px;height:100px;background:var(--ink)">ولا تطبيق واحد؟</span></div>` },
  '07': { bg: '', tag: 'Collab · ماتش خماسي', title: [['b-paper', 150, 'ماتش واحد'], ['b-blaze', 160, '3 حكايات'], ['note', 50, 'ملعب، ولاعيبة، و<mark>براند مصري</mark>']],
    art: `<div class="abs" style="left:300px;top:1000px;width:480px;height:480px;border-radius:50%;background:var(--turf)"></div>
          <img class="abs art" src="${R}/02-tee-3d/assets/tee-print.png" style="left:300px;top:930px;width:480px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.5))">
          <div class="abs art" style="right:60px;top:1040px;transform:rotate(-5deg)"><span class="cta" style="background:var(--surface);color:var(--ink);font-size:36px">⚽ الملعب</span></div>
          <div class="abs art" style="left:60px;top:1190px;transform:rotate(4deg)"><span class="cta" style="background:var(--surface);color:var(--ink);font-size:36px">🧢 الكابتن</span></div>
          <div class="abs art" style="right:80px;top:1340px;transform:rotate(-3deg)"><span class="cta" style="background:var(--surface);color:var(--ink);font-size:36px">👕 البراند</span></div>` },
};
const r = new URLSearchParams(location.search).get('r') || '01', c = COVERS[r];
if (c.bg) document.body.classList.add(c.bg); else document.getElementById('ht').style.display = 'block';
if (c.bg) document.getElementById('ht').style.display = 'none';
document.getElementById('tagtx').textContent = c.tag;
document.getElementById('series').textContent = `REEL ${r}`;
const tilts = [-2, 1.5, -1];
document.getElementById('c').innerHTML = `<div class="abs title">${c.title.map(([cls, size, txt], i) => cls === 'note'
  ? `<span class="note" style="font-size:${size}px;margin-top:8px;transform:rotate(${tilts[i]}deg)">${txt}</span>`
  : `<span class="block ${cls}" style="font-size:${size}px;transform:rotate(${tilts[i]}deg);${i === 1 && size < 150 && txt.length < 12 ? 'margin-inline-start:50px' : ''}">${txt}</span>`).join('')}</div>${c.art}`;
document.getElementById('foot').innerHTML = MARK.replace('width="120" height="120"', 'width="70" height="70"') + '<span class="wm">SUPER APP</span>';
window.ready = Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
</script>
</body>
</html>
