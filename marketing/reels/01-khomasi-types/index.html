<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel 01 — أنواع اللاعيبة في ماتش الخماسي</title>
<!-- Super App reel 01 · collage style (docs/brand/prompts.md P5) · 1080×1920 · 15 s.
     Deterministic: window.render(t) draws the frame at t seconds; render.js steps it at 30 fps. -->
<style>
@font-face { font-family: "Archivo"; src: url(../../../vendor/fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Cairo"; src: url(../../../vendor/fonts/cairo-arabic.woff2) format("woff2"); font-weight: 400 800; }
:root {
  --paper: #F1F2EE; --surface: #FFFFFF; --ink: #0D1411; --ink-2: #46514B; --ink-bg: #0D1411;
  --turf: #0B6E4F; --turf-tint: #E1F0E8; --blaze: #FF5B14; --gold-tint: #FBF1D6;
  --font: "Cairo", "Archivo", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
body { font-family: var(--font); color: var(--ink); position: relative; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.grain { inset: 0; opacity: .5; mix-blend-mode: multiply; pointer-events: none; }
.chalk { inset: 0; }
.chalk * { fill: none; stroke: var(--ink); stroke-width: 4; opacity: .06; }
.tag { top: 270px; right: 60px; height: 72px; padding: 0 32px; border-radius: 999px; background: var(--turf-tint); color: var(--turf); font-weight: 800; font-size: 34px; display: flex; align-items: center; gap: 14px; }
.tag i { width: 14px; height: 14px; border-radius: 50%; background: var(--turf); display: block; }
.count { top: 276px; left: 60px; height: 60px; padding: 0 24px; border-radius: 999px; background: var(--ink-bg); color: #fff; font: 800 30px "Archivo", sans-serif; display: flex; align-items: center; direction: ltr; }
.strip { background: var(--surface); padding: 34px 48px 40px; box-shadow: 0 18px 30px -18px rgba(13,20,17,.45); }
.strip h1, .strip h2 { font-weight: 800; line-height: 1.22; letter-spacing: normal; }
.tape { width: 170px; height: 54px; background: rgba(251,241,214,.82); box-shadow: 0 2px 6px rgba(13,20,17,.12); }
.w { display: inline-block; }
.quote { left: 60px; right: 140px; bottom: 470px; display: flex; justify-content: center; }
.quote span { background: rgba(13,20,17,.88); color: #fff; font-weight: 700; font-size: 56px; line-height: 1.35; padding: 16px 34px 22px; border-radius: 28px; text-align: center; }
.quote b { color: var(--blaze); font-weight: 800; }
.note { left: 60px; right: 140px; bottom: 380px; display: flex; justify-content: center; }
.note span { background: var(--turf-tint); color: var(--turf); font-weight: 800; font-size: 36px; padding: 10px 28px 14px; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage">
  <svg class="abs grain" width="1080" height="1920" aria-hidden="true">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .05  0 0 0 0 .08  0 0 0 0 .07  0 0 0 .09 0"/></filter>
    <rect width="1080" height="1920" filter="url(#n)"/>
  </svg>
  <svg class="abs chalk" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true">
    <line x1="0" y1="960" x2="1080" y2="960"/><circle cx="540" cy="960" r="230"/>
    <rect x="290" y="-10" width="500" height="250"/><rect x="290" y="1680" width="500" height="250"/>
  </svg>
  <div class="abs tag"><i></i>ماتش خماسي</div>
  <div class="abs count" id="count">1/5</div>
  <div id="scenes"></div>
</div>
<script>
const W = 1080, H = 1920, DUR = 15;
const BODY = 'M14 6 L22 3 Q32 8 42 3 L50 6 L60 16 L52 25 L48 22 L48 60 L16 60 L16 22 L12 25 L4 16 Z';

// Brand easing: cubic-bezier(.2,.8,.2,1) and the spring cubic-bezier(.34,1.56,.64,1)
function bezier(p1x, p1y, p2x, p2y) {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const d = (3 * ax * t + 2 * bx) * t + cx; const e = sx(t) - x; if (Math.abs(e) < 1e-5 || !d) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
}
const ease = bezier(.2, .8, .2, 1), spring = bezier(.34, 1.56, .64, 1);
const clamp = (v) => Math.min(1, Math.max(0, v));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;

// Jagged torn-paper edges, seeded so every frame is identical
function torn(seed, w, h, amp = 10, step = 28) {
  let s = seed; const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const pts = [];
  for (let x = 0; x <= w; x += step) pts.push(`${x}px ${r() * amp}px`);
  for (let y = 0; y <= h; y += step) pts.push(`${w - r() * amp * .6}px ${y}px`);
  for (let x = w; x >= 0; x -= step) pts.push(`${x}px ${h - r() * amp}px`);
  for (let y = h; y >= 0; y -= step) pts.push(`${r() * amp * .6}px ${y}px`);
  return `polygon(${pts.join(',')})`;
}

const KITS = [
  { n: '10', a: '#1E3A8A', b: '#F8D24A', p: 'stripes', ink: '#fff', label: 'اللي مبيباصيش', quote: 'الكورة بتاعته <b>من البيت</b>' },
  { n: '1', a: '#9BE15D', b: '#0D1411', p: 'solid', ink: '#0D1411', label: 'الحارس بالدور', quote: '<b>خمس دقايق</b> بس وراجع قدام' },
  { n: '7', a: '#0B6E4F', b: '#FFFFFF', p: 'hoops', ink: '#fff', label: 'اللي جاي متأخر', quote: 'أنا تحت البيت… <b>من ساعة</b>' },
  { n: '8', a: '#334155', b: '#94A3B8', p: 'half', ink: '#fff', label: 'المحلل', quote: 'لو كنت باصيت <b>شمال</b> كان جول' },
  { n: '5', a: '#0E7490', b: '#FFFFFF', p: 'solid', ink: '#fff', label: 'اللي بيلم الفلوس', quote: 'يا رجالة اللي مدفعش <b>الـ 45 جنيه</b>', note: 'على Super App كل واحد بيدفع نصيبه' },
];
function kitSvg(k, i) {
  const id = 'k' + i;
  const pat = {
    solid: '',
    stripes: [18, 28, 38].map((x) => `<rect x="${x}" y="0" width="5" height="64" fill="${k.b}"/>`).join(''),
    hoops: [24, 36, 48].map((y) => `<rect x="0" y="${y}" width="64" height="5" fill="${k.b}"/>`).join(''),
    half: `<rect x="32" y="0" width="32" height="64" fill="${k.b}"/>`,
    sash: `<path d="M10 10 L22 6 L56 60 L44 64 Z" fill="${k.b}"/>`,
  }[k.p];
  return `<svg width="600" height="600" viewBox="-4 -4 72 72" style="overflow:visible">
    <defs><clipPath id="${id}"><path d="${BODY}"/></clipPath></defs>
    <path d="${BODY}" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <path d="${BODY}" fill="${k.a}"/><g clip-path="url(#${id})">${pat}</g>
    <path d="M24 4.2 Q32 10 40 4.2" fill="none" stroke="${k.p === 'solid' ? k.b : 'rgba(0,0,0,.35)'}" stroke-width="2.4"/>
    <text x="32" y="44" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="20" fill="${k.ink}" >${k.n}</text>
  </svg>`;
}

// Timeline
const HOOK = [0, 1.6], SCENE0 = 1.6, SCENE = 2.4, END = 13.6;
const scenesEl = document.getElementById('scenes');
const words = (s) => s.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ');

scenesEl.innerHTML = `
  <div class="abs" id="hook" style="left:90px;right:90px;top:620px">
    <div class="strip" style="clip-path:${torn(3, 900, 470)};transform:rotate(-2.5deg)">
      <h1 style="font-size:96px">${words('في كل ماتش خماسي')}</h1>
      <h1 style="font-size:96px;color:var(--turf);padding-bottom:10px">${words('فيه الخمسة دول')}</h1>
    </div>
    <div class="abs tape" style="top:-22px;right:60px;transform:rotate(6deg)"></div>
    <div class="abs tape" style="bottom:-34px;left:-10px;transform:rotate(-8deg)"></div>
  </div>
  ${KITS.map((k, i) => `
  <div class="abs scene" id="s${i}" style="inset:0">
    <div class="abs sticker" style="left:240px;top:420px;width:600px;height:600px;filter:drop-shadow(0 26px 28px rgba(13,20,17,.28))">${kitSvg(k, i)}</div>
    <svg class="abs scribble" width="1080" height="1920" viewBox="0 0 1080 1920" style="inset:0">
      <path d="M200 1150 C 150 1080, 170 980, 250 940" fill="none" stroke="var(--blaze)" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      <path d="M222 958 L 252 938 L 238 972" fill="none" stroke="var(--blaze)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    </svg>
    <div class="abs label" style="right:90px;top:1080px">
      <div class="strip" style="clip-path:${torn(11 + i * 5, 840, 200)};width:840px;padding:36px 50px 44px;text-align:center">
        <h2 style="font-size:92px;white-space:nowrap">${k.label}</h2>
      </div>
      <div class="abs tape" style="top:-20px;left:40px;transform:rotate(-7deg);width:140px"></div>
    </div>
    <div class="abs quote"><span>${k.quote}</span></div>
    ${k.note ? `<div class="abs note"><span>${k.note}</span></div>` : ''}
  </div>`).join('')}
  <div class="abs" id="end" style="left:90px;right:90px;top:640px">
    <div class="strip" style="clip-path:${torn(41, 900, 420)};transform:rotate(1.8deg);text-align:center">
      <h1 style="font-size:104px;white-space:nowrap">${words('منشن صاحبك ده')}</h1>
      <p style="font-size:44px;font-weight:700;color:var(--ink-2);margin-top:14px">وانت… رقم كام فيهم؟</p>
    </div>
    <div class="abs tape" style="top:-24px;left:70px;transform:rotate(-5deg)"></div>
  </div>
  <div class="abs" id="brand" style="left:0;right:0;top:1250px;display:flex;flex-direction:column;align-items:center;gap:18px">
    <svg width="120" height="120" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#0D1411"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg>
    <div style="font:800 40px Archivo, sans-serif;letter-spacing:-.02em;font-stretch:125%;direction:ltr">SUPER APP</div>
    <div style="font-size:34px;font-weight:700;color:var(--ink-2)">كل الكورة في مكان واحد</div>
  </div>`;

const $ = (s) => document.querySelector(s);
const show = (el, o, tf) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; };

window.render = function (t) {
  // Hook: words rise in one by one, then the strip flies off
  const hook = $('#hook');
  const hookOut = prog(t, HOOK[1] - .25, .3);
  show(hook, t < HOOK[1] + .1 ? 1 - hookOut : 0, `translateX(${-ease(hookOut) * 1100}px) rotate(${-ease(hookOut) * 12}deg)`);
  hook.querySelectorAll('.w').forEach((w, i) => {
    const p = ease(prog(t, .05 + i * .1, .45));
    w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 70}px) rotate(${(1 - p) * 6}deg)`;
  });

  // Five player types
  let active = -1;
  KITS.forEach((k, i) => {
    const a = SCENE0 + i * SCENE, b = a + SCENE, el = $('#s' + i);
    if (t < a - .05 || t > b + .05) { el.style.opacity = 0; return; }
    active = i; el.style.opacity = 1;
    const out = prog(t, b - .28, .28), oe = ease(out);
    const pin = spring(prog(t, a, .5));
    const tilt = [-6, 5, -4, 7, -5][i];
    const bob = Math.sin((t - a) * 3.2) * 6;
    el.querySelector('.sticker').style.transform =
      `translate(${-oe * 1150}px, ${bob - (1 - pin) * 160}px) rotate(${tilt + (1 - pin) * -18 - oe * 20}deg) scale(${lerp(.55, 1, pin)})`;
    el.querySelector('.sticker').style.opacity = clamp(pin * 3);
    const lp = spring(prog(t, a + .25, .45));
    el.querySelector('.label').style.transform = `translate(${-oe * 1150}px, ${(1 - lp) * 120}px) rotate(${[2, -2.5, 1.5, -2, 2.5][i] - oe * 10}deg) scale(${lerp(.8, 1, lp)})`;
    el.querySelector('.label').style.opacity = clamp(lp * 3);
    const paths = el.querySelectorAll('.scribble path');
    paths[0].style.strokeDashoffset = 1 - ease(prog(t, a + .45, .35));
    paths[1].style.strokeDashoffset = 1 - ease(prog(t, a + .75, .15));
    el.querySelector('.scribble').style.opacity = 1 - out;
    const q = ease(prog(t, a + .55, .3));
    show(el.querySelector('.quote'), q * (1 - out), `translateY(${(1 - q) * 40}px)`);
    const note = el.querySelector('.note');
    if (note) { const n = spring(prog(t, a + 1.1, .4)); show(note, clamp(n * 2) * (1 - out), `scale(${lerp(.6, 1, n)})`); }
  });
  const count = $('#count');
  count.textContent = active >= 0 ? `${active + 1}/5` : '';
  count.style.opacity = active >= 0 ? 1 : 0;

  // End card
  const end = $('#end'), e = spring(prog(t, END, .5));
  show(end, t >= END ? clamp(e * 3) : 0, `translateY(${(1 - e) * 160}px) rotate(${(1 - e) * 8}deg) scale(${lerp(.8, 1, e)})`);
  end.querySelectorAll('.w').forEach((w, i) => {
    const p = ease(prog(t, END + .1 + i * .08, .4));
    w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 50}px)`;
  });
  const br = ease(prog(t, END + .45, .4));
  show($('#brand'), br, `translateY(${(1 - br) * 40}px)`);
};
window.DURATION = DUR;
render(0);
</script>
</body>
</html>
