<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel 03 — فانتازي المصري والإنجليزي في حساب واحد</title>
<!-- Super App reel 03 · audience: fantasy players (FPL + Egyptian league) · 1080×1920 · 15 s · collage on turf grid.
     Real app screens (assets/, demo data) in a phone frame. Uses the shared kit in ../_kit. -->
<link rel="stylesheet" href="../_kit/reel.css">
<style>
  #phone { left: 270px; top: 380px; width: 540px; height: 1110px; z-index: 10; }
  #phone .screen img { display: none; }
  .label { z-index: 20; height: 84px; padding: 0 34px 6px; border-radius: 999px; font-weight: 800; font-size: 42px; display: flex; align-items: center; box-shadow: 0 14px 20px -12px rgba(0,0,0,.5); white-space: nowrap; }
  #ticket { right: 30px; top: 990px; white-space: nowrap; z-index: 22; width: 470px; background: var(--cream); padding: 26px 34px 30px; box-shadow: 0 22px 30px -16px rgba(0,0,0,.6); border-left: 8px dashed rgba(13,20,17,.25); }
  #ticket small { display: block; font-size: 30px; font-weight: 800; color: var(--ink-2); }
  #ticket b { display: block; font: 800 64px "Archivo", sans-serif; letter-spacing: .04em; direction: ltr; text-align: right; }
  #chat { left: 40px; top: 470px; z-index: 22; display: flex; flex-direction: column; gap: 18px; width: 560px; }
</style>
</head>
<body class="bg-turf">
<div class="abs tag"><i></i>فانتازي الدوري المصري</div>
<div class="abs step" id="step"></div>

<div class="abs stack" id="hook">
  <span class="block b-paper hw" style="font-size:124px">بتلعب فانتازي</span>
  <span class="block b-blaze hw" style="font-size:124px;margin-inline-start:60px">المصري</span>
  <span class="block b-ink hw" style="font-size:110px">ولا الإنجليزي؟</span>
  <span class="note hw" style="font-size:52px;margin-top:14px"><mark>ليه تختار؟</mark> العب الاتنين</span>
</div>

<div class="abs phone" id="phone"><div class="screen">
  <img data-s="egy" src="assets/fx-egy.jpg"><img data-s="epl" src="assets/fx-epl.jpg"><img data-s="groups" src="assets/groups.jpg">
</div></div>
<div class="abs tape" id="tp" style="left:230px;top:360px;z-index:12;transform:rotate(-28deg)"></div>
<div class="abs label" id="lb-egy" style="right:40px;top:560px;background:var(--cream);color:var(--ink)">الدوري المصري</div>
<div class="abs label" id="lb-epl" style="left:40px;top:560px;background:var(--surface);color:var(--ink)">الدوري الإنجليزي</div>
<div class="abs label" id="lb-switch" style="right:40px;top:860px;background:var(--blaze);color:#fff">ضغطة واحدة ←</div>

<div class="abs" id="ticket"><small>كود جروب الشلة</small><b>SA-EPL7W3</b></div>
<div class="abs" id="chat">
  <div class="bubble b-in"><span class="who">كريم</span>دخلت ✅</div>
  <div class="bubble b-in"><span class="who">زياد</span>وأنا… الكابتن صلاح طبعًا</div>
  <div class="bubble b-in"><span class="who">عمرو</span>اللي هيطلع آخر يعزم 😂</div>
</div>

<div class="abs cap" id="cap"></div>

<div class="abs stack" id="end">
  <span class="block b-paper ew" style="font-size:140px">فريقين</span>
  <span class="block b-blaze ew" style="font-size:140px;margin-inline-start:70px">حساب واحد</span>
  <span class="note ew" style="font-size:48px;margin-top:10px">فانتازي <mark>المصري والإنجليزي</mark> على Super App</span>
</div>
<div class="abs brand" id="brand"></div>

<svg class="abs grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .2 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
<script src="../_kit/reel.js"></script>
<script>
const T = { steps: [1.6, 5.0, 8.6], end: 12.6 };
const S = T.steps;
Reel({
  T,
  caps: [
    ['فريق للمصري', '15 لاعب · 100 مليون · <mark>3 من كل نادي</mark>'],
    ['وفريق للإنجليزي', 'من <mark>نفس الحساب</mark>… من غير أبلكيشن تاني'],
    ['ودوري للشلة', 'ابعت الكود على <mark>جروب الواتساب</mark>'],
  ],
  scene(t) {
    // phone: rises at step 1, flips to the EPL screen in step 2, scrolls to the groups in step 3, leaves before the end
    const inP = spring(prog(t, S[0] + .05, .5)), out = ease(prog(t, T.end - .3, .3));
    const flip = prog(t, S[1] + .25, .4), sx = Math.abs(Math.cos(flip * Math.PI));
    const ph = $('#phone');
    show(ph, t > S[0] && t < T.end + .05 ? clamp(inP * 3) * (1 - out) : 0,
      `translate(${jit(2, t, 2) + (t >= S[2] ? lerp(0, 120, ease(prog(t, S[2], .45))) : 0)}px, ${(1 - inP) * 700 + out * 300}px) rotate(${lerp(8, -3, inP) + jit(3, t, .4)}deg) scaleX(${t > S[1] + .2 && t < S[1] + .7 ? Math.max(.02, sx) : 1})`);
    const scr = t < S[1] + .45 ? 'egy' : t < S[2] + .2 ? 'epl' : 'groups';
    $$('#phone img').forEach((im) => { im.style.display = im.dataset.s === scr ? 'block' : 'none'; });
    show($('#tp'), ph.style.display === 'none' ? 0 : clamp(inP * 3) * (1 - out) * (t < S[2] ? 1 : 0));

    // labels
    const le = spring(prog(t, S[0] + .5, .35)), lw = spring(prog(t, S[1] + .7, .35)), lsw = spring(prog(t, S[1] + .25, .3));
    const lOut = ease(prog(t, S[2] - .2, .25));
    show($('#lb-egy'), t > S[0] + .5 && t < S[2] ? clamp(le * 3) * (1 - lOut) : 0, `rotate(${4 + jit(5, t, .8)}deg) scale(${lerp(1.6, 1, le)})`);
    show($('#lb-epl'), t > S[1] + .7 && t < S[2] ? clamp(lw * 3) * (1 - lOut) : 0, `rotate(${-4 + jit(6, t, .8)}deg) scale(${lerp(1.6, 1, lw)})`);
    show($('#lb-switch'), t > S[1] + .25 && t < S[2] ? clamp(lsw * 3) * (1 - lOut) : 0, `rotate(${-3 + jit(7, t, .8)}deg) scale(${lerp(1.6, 1, lsw)})`);

    // step 3: invite code ticket + the crew replying
    const tk = spring(prog(t, S[2] + .45, .4)), gOut = ease(prog(t, T.end - .3, .3));
    show($('#ticket'), t > S[2] + .45 && t < T.end + .05 ? clamp(tk * 3) * (1 - gOut) : 0, `translate(${(1 - tk) * 400}px, ${jit(8, t, 2)}px) rotate(${lerp(14, 3, tk)}deg)`);
    show($('#chat'), t > S[2] + 1 && t < T.end + .05 ? 1 - gOut : 0);
    $$('#chat .bubble').forEach((b, i) => { const p = spring(prog(t, S[2] + 1.1 + i * .55, .3)); b.style.opacity = clamp(p * 3); b.style.transform = `translateY(${(1 - p) * 60}px) scale(${lerp(.6, 1, p)}) rotate(${[-1.5, 1, -1][i]}deg)`; });
  },
});
</script>
</body>
</html>
