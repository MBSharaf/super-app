<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Reel 12 — ناقصك واحد في البادل؟</title>
<!-- Super Malaab reel 12 · padel players · 16.5 s · reference style. Open Match: 4 players, level 1–7, the court cost split
     by 4, everyone told when it is full (commit "Padel Open Match on the server", 2026-11-21). The match page and join sheet
     are real captures; the green "full" screen is drawn here to show the notification moment. The court total is not stated. -->
<link rel="stylesheet" href="../_app/app.css">
<style>
  #succ { height: 1148px; background: #16A34A; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  #succ .ok { width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; }
  #succ h3 { font-size: 64px; font-weight: 800; } #succ .n { font: 800 90px "Archivo", sans-serif; direction: ltr; }
  #succ .dots { display: flex; gap: 16px; } #succ .dots i { width: 40px; height: 40px; border-radius: 50%; background: #fff; }
  #succ .toast { margin-top: 40px; background: #fff; color: #0D1411; border-radius: 30px; padding: 22px 28px; display: flex; gap: 16px; align-items: center; font-size: 30px; font-weight: 800; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }
  #levels { left: 0; right: 0; top: 1390px; display: flex; justify-content: center; gap: 14px; z-index: 30; }
  #levels span { width: 104px; height: 104px; border-radius: 50%; background: #fff; color: #0D1411; display: grid; place-items: center; font: 800 50px "Archivo", sans-serif; box-shadow: 0 16px 30px -16px rgba(0,0,0,.5); }
  #levels span.on { background: #1F5FBF; color: #fff; transform: scale(1.15); }
  #split { left: 0; right: 0; top: 1360px; display: flex; justify-content: center; align-items: center; gap: 24px; z-index: 30; }
  .hookdots { display: flex; gap: 26px; margin-bottom: 40px; } .hookdots i { width: 90px; height: 90px; border-radius: 50%; background: #34C88E; } .hookdots i.e { background: transparent; border: 8px solid #FF5B14; }
</style>
</head>
<body>
<div class="abs" id="bg"></div><div class="abs" id="bg2"></div>

<div class="abs" id="hook"><div class="hookdots"><i></i><i></i><i></i><i class="e"></i></div><div class="h2">ناقصك واحد</div><div class="h1" style="color:#6FA2F0;font-size:150px">في البادل؟</div></div>
<div class="abs" id="title"></div>

<div class="abs" id="phone"><div class="scr">
  <img data-s="pm" class="full" src="../_app/shots/padel-match-2.jpg">
  <img data-s="js" class="full" src="../_app/shots/padel-join-sheet.jpg">
  <div data-s="ok" id="succ">
    <div class="ok"><svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3>الماتش اكتمل</h3><div class="n">4/4</div>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
    <div class="toast"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0D1411" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>اتبعت إشعار للأربعة</div>
  </div>
  <div class="abs" id="tap"></div>
  <div class="island"></div>
</div></div>

<div class="abs" id="levels"><span>1</span><span>2</span><span>3</span><span class="on">4</span><span>5</span><span>6</span><span>7</span></div>
<div class="abs" id="split"><span class="chip dark num" style="font-size:96px;padding:14px 40px 22px">÷ 4</span><span class="chip" id="share" style="font-size:64px">375 ج.م للفرد</span></div>

<div class="abs" id="end"></div>
<script src="../_app/app.js"></script>
<script>
AppReel({
  dur: 16.5, vo: .15,
  hook: { until: 1.75 },
  lines: [
    [0, 1.11, ''], [1.73, 3.25, 'اعمل <b>Open Match</b><br>على سوبر ملعب'], [3.72, 4.59, 'أربع لاعيبة بس،'],
    [4.85, 7.29, 'وكل واحد بيختار<br>مستواه من 1 لـ 7'], [7.73, 9.29, 'حساب الملعب<br>بيتقسم على 4'],
    [9.62, 10.8, 'وأول ما الماتش يكمل…'], [11.07, 12.36, 'الكل بيوصله إشعار.'],
  ],
  scenes: [
    { t: 0, bg: '#0D1411', screen: 'pm' },
    { t: 1.75, bg: '#1F5FBF', screen: 'pm' },
    { t: 3.7, bg: '#F1F2EE', fg: '#0D1411', screen: 'js' },
    { t: 7.85, bg: '#0B6E4F', screen: 'pm' },
    { t: 9.75, bg: '#16A34A', screen: 'ok' },
  ],
  phone: [[0, { y: 0, s: 1 }], [3.7, { y: 0, s: 1 }], [4.4, { y: 440, s: 1.5, d: .7 }], [7.45, { y: 440, s: 1.5 }], [7.85, { y: 0, s: 1 }], [9.75, { y: 0, s: 1 }], [11.2, { y: 0, s: 1.04, r: 2 }]],
  taps: [[3.4, 90, 739]],
  pops: [{ id: 'levels', t0: 5.0, t1: 7.8 }, { id: 'split', t0: 8.0, t1: 9.75 }],
  end: { at: 12.9, line: 'بادل · كورة · فانتازي' },
  custom(t) { document.getElementById('share').style.opacity = t > 8.6 ? 1 : 0; },
});
</script>
</body>
</html>
