<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Post 11 — QR من النجيلة</title>
<!-- Audience: pitch owners. One big shape: a QR-like pattern built from turf tiles (decorative, not scannable).
     The strip quotes the partner dashboard's real check-in line ('Collect from the customer now:' → 'حصّل من العميل دلوقتي:').
     Numbers are an example: 500 EGP hour, 20% deposit = 100 EGP paid online, 400 collected at the pitch. -->
<link rel="stylesheet" href="collage.css">
<style>
  body { background: #F1F2EE; }
  .scan { position: absolute; background: var(--ink); color: #fff; font-weight: 800; padding: 18px 40px 28px; box-shadow: 0 24px 30px -18px rgba(0,0,0,.55); white-space: nowrap; }
  .scan b { font: 800 1em "Archivo", sans-serif; color: var(--blaze); }
  .fine { position: absolute; font-size: 26px; font-weight: 700; color: var(--ink-2); line-height: 1.55; }
</style></head>
<body>
  <img class="abs" src="assets/turf-qr.svg" style="left:-60px;top:250px;width:860px;height:860px;transform:rotate(-6deg);filter:drop-shadow(0 30px 30px rgba(0,0,0,.25))" alt="">

  <div class="abs" style="left:64px;top:60px;display:flex;align-items:center;gap:14px;direction:ltr">
    <svg width="64" height="64" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#0D1411"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg>
    <span class="handle" style="font-size:30px;font-weight:850;font-stretch:125%">SUPER MALAAB</span>
  </div>
  <div class="abs tag" style="top:56px;right:64px"><i></i>لأصحاب الملاعب</div>

  <div class="abs" style="right:64px;top:170px;display:flex;flex-direction:column;align-items:flex-start;gap:12px">
    <span class="block b-ink" style="font-size:104px;transform:rotate(1.5deg)">العربون اتدفع.</span>
    <span class="block b-paper" style="font-size:68px;transform:rotate(-1deg)">الباقي بيتحصّل هنا.</span>
  </div>

  <div class="scan" style="right:-20px;top:1010px;font-size:58px;transform:rotate(-2deg)">حصّل من العميل دلوقتي: <b>400</b> جنيه</div>
  <div class="abs tape" style="right:620px;top:996px;transform:rotate(20deg);width:120px"></div>

  <div class="fine" style="right:64px;top:1170px;width:640px;font-size:24px">
    مثال: ساعة بـ 500 جنيه. العربون 100 اتدفع أونلاين بالكارت،<br>والـ 400 في إيدك لما تعمل scan للـ QR بتاع اللاعب.
  </div>
  <div class="abs" style="left:64px;top:1250px;z-index:6"><span class="cta" style="font-size:30px;height:66px;padding:0 30px 4px">ابعتلنا رسالة</span></div>

  <svg class="abs grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="21"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .18 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
</body></html>
