<!doctype html><html><head><meta charset="utf-8">
<!-- Renders our own tee model (models/tee.glb) on a transparent background for the posts. Open through a local server. -->
<script type="importmap">{"imports":{"three":"../../../vendor/three/three.module.min.js"}}</script>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../../vendor/three/addons/GLTFLoader.js';
const W = 1000, H = 1000;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(28, W / H, .1, 50); cam.position.set(0, 0, 2.35);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.9); key.position.set(1.5, 2, 2.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, .6); rim.position.set(-2, 1, -1); scene.add(rim);
new GLTFLoader().load('../../../models/tee.glb', (g) => {
  let geo; g.scene.traverse((o) => { if (o.isMesh && !geo) geo = o.geometry; });
  geo.computeBoundingBox(); const b = geo.boundingBox, c = new THREE.Vector3(), s = new THREE.Vector3();
  b.getCenter(c); b.getSize(s); geo.translate(-c.x, -c.y, -c.z); geo.scale(1 / s.y, 1 / s.y, 1 / s.y); geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color(location.hash ? '#' + location.hash.slice(1) : '#F4EEDF'), roughness: .92, side: THREE.DoubleSide }));
  mesh.rotation.y = -0.18; scene.add(mesh);
  r.render(scene, cam); document.body.dataset.ready = '1';
});
</script></body></html>
