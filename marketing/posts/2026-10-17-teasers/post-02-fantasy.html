<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Post 02 — فانتازي الدوري المصري والإنجليزي</title>
<!-- Audience: fantasy players (FPL + Egyptian league). Goal: comments + follows. Real app screens: /fantasy and /fantasy/squad.
     Positioning per CLAUDE.md: both leagues in one app — never "first Egyptian fantasy". -->
<link rel="stylesheet" href="collage.css"></head>
<body class="bg-turf">
  <!-- headline -->
  <div class="abs tag" style="top:56px;right:64px"><i></i>فانتازي</div>
  <div class="abs" style="right:64px;top:150px;display:flex;flex-direction:column;align-items:flex-start;gap:16px">
    <span class="block b-blaze" style="font-size:118px;transform:rotate(-2deg)">الدوري المصري</span>
    <span class="block b-paper" style="font-size:118px;transform:rotate(1.5deg);margin-inline-start:30px">والإنجليزي</span>
    <span class="block b-ink" style="font-size:84px;transform:rotate(-1deg)">في تطبيق واحد</span>
  </div>

  <!-- the real app: league switcher + deadline, in a phone; the squad picker as a taped cut-out -->
  <div class="abs" style="left:-60px;top:640px;width:520px;height:520px;border-radius:50%;background:var(--blaze)"></div>
  <div class="abs phone" style="left:70px;top:610px;width:420px;height:880px;transform:rotate(-6deg)">
    <div class="screen"><img src="assets/app-fantasy.png" alt=""></div>
  </div>
  <div class="abs tape" style="left:50px;top:610px;transform:rotate(-36deg)"></div>

  <div class="abs" style="right:90px;top:640px;width:420px;height:470px;background:var(--surface);padding:18px 18px 64px;transform:rotate(4deg);box-shadow:0 26px 34px -18px rgba(0,0,0,.6)">
    <div style="width:100%;height:100%;overflow:hidden;background:#0B6E4F"><img src="assets/app-squad.png" alt="" style="width:100%;margin-top:-104%"></div>
    <div style="position:absolute;bottom:14px;right:24px;font:700 30px Cairo">اختار الـ 15 بتوعك</div>
  </div>
  <div class="abs tape" style="right:220px;top:618px;transform:rotate(-4deg);width:150px"></div>

  <!-- chalk circle + arrow on the league switcher -->
  <svg class="abs" style="inset:0" width="1080" height="1350" viewBox="0 0 1080 1350">
    <ellipse cx="350" cy="722" rx="150" ry="44" fill="none" stroke="#fff" stroke-width="8" transform="rotate(-6 350 722)"/>
    <path d="M560 1190 C 520 1080, 480 900, 450 780" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M432 812 L 448 772 L 482 796" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- engagement question + stamp -->
  <div class="abs note" style="right:64px;top:1140px;width:420px;font-size:42px;transform:rotate(-1.5deg)">
    <mark>كابتنك مين</mark> الجولة دي؟ قولنا في الكومنتات
  </div>
  <div class="abs stampbox" style="left:430px;top:1150px;color:var(--turf);transform:rotate(9deg);width:150px;height:180px"><b style="font-size:46px;direction:ltr;font-family:Archivo">26/27</b><span>SEASON</span></div>

  <!-- brand mark -->
  <div class="abs" style="left:64px;top:60px;display:flex;align-items:center;gap:14px;direction:ltr;color:#fff">
    <svg width="64" height="64" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#0D1411"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg>
    <span class="handle" style="font-size:30px;font-weight:850;font-stretch:125%">SUPER APP</span>
  </div>

  <svg class="abs grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .22 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
