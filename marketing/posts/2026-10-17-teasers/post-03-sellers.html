<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Post 03 — افتح براند تيشيرتات بصفر جنيه</title>
<!-- Audience: people who want to start a clothing brand / designers. Goal: follows before launch.
     Photo: our own garment photo (models/source/tee-front.png) as a cut-out, with a sample print. -->
<link rel="stylesheet" href="collage.css">
<style>
  .tee { filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 30px 30px rgba(0,0,0,.55)); }
  .print { mix-blend-mode: multiply; }
  .step { display: flex; align-items: center; gap: 18px; }
  .step b { font: 800 46px "Archivo", sans-serif; color: var(--blaze); direction: ltr; min-width: 70px; }
</style></head>
<body class="bg-ink">
  <div class="abs halftone"></div>

  <!-- headline -->
  <div class="abs tag" style="top:56px;right:64px"><i></i>بيع على Super App</div>
  <div class="abs" style="right:64px;top:150px;display:flex;flex-direction:column;align-items:flex-start;gap:16px">
    <span class="block b-paper" style="font-size:120px;transform:rotate(-2deg)">افتح براند</span>
    <span class="block b-blaze" style="font-size:120px;transform:rotate(1.5deg);margin-inline-start:50px">تيشيرتات</span>
    <span class="block b-cream" style="font-size:120px;transform:rotate(-1deg)">بـ 0 جنيه</span>
  </div>

  <!-- the tee: our own photo, cut out, with a sample print -->
  <div class="abs" style="left:40px;top:560px;width:560px;height:560px;border-radius:50%;background:var(--blaze)"></div>
  <div class="abs tee" style="left:40px;top:560px;width:560px;transform:rotate(-6deg)">
    <img src="assets/tee-3d.png" alt="" style="width:100%;display:block">
    <div class="abs print" style="left:178px;top:150px;width:210px;text-align:center">
      <svg width="210" height="200" viewBox="0 0 210 200">
        <circle cx="105" cy="70" r="56" fill="none" stroke="#0D1411" stroke-width="7"/>
        <path d="M105 14v112M49 70h112" stroke="#0D1411" stroke-width="5"/>
        <rect x="18" y="138" width="174" height="50" fill="#FF5B14"/>
        <text x="105" y="176" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="36" fill="#fff">خماسي</text>
      </svg>
    </div>
  </div>
  <div class="abs tape" style="left:60px;top:560px;transform:rotate(-30deg)"></div>
  <div class="abs tape" style="left:430px;top:600px;transform:rotate(26deg);width:140px"></div>

  <!-- three steps on a lined note -->
  <div class="abs note" style="right:64px;top:640px;width:470px;font-size:38px;transform:rotate(2deg);line-height:56px">
    <div class="step"><b>01</b>ارفع تصميمك</div>
    <div class="step"><b>02</b>إحنا بنطبع ونشحن</div>
    <div class="step"><b>03</b><span>إنت <mark>بتكسب</mark></span></div>
  </div>
  <div class="abs tape" style="right:260px;top:622px;transform:rotate(-4deg);width:130px"></div>

  <!-- price stamp + chalk arrow -->
  <div class="abs stampbox" style="right:120px;top:930px;color:var(--ink);transform:rotate(-9deg);width:200px;height:220px"><b style="font-family:Archivo;direction:ltr;font-size:72px">0</b><span>EGP · STOCK</span></div>
  <svg class="abs" style="inset:0" width="1080" height="1350" viewBox="0 0 1080 1350">
    <path d="M780 1040 C 720 1060, 660 1020, 620 960" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M606 996 L 616 954 L 652 976" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- no stock, no factory, no capital -->
  <div class="abs" style="right:64px;top:1200px;display:flex;gap:14px;flex-wrap:wrap">
    <span class="block b-cream" style="font-size:38px;padding:4px 22px 12px;transform:rotate(-1.5deg)">من غير مخزن</span>
    <span class="block b-paper" style="font-size:38px;padding:4px 22px 12px;transform:rotate(1.5deg)">من غير مصنع</span>
    <span class="block b-blaze" style="font-size:38px;padding:4px 22px 12px;transform:rotate(-1deg)">تابعنا · قريب</span>
  </div>

  <!-- brand mark -->
  <div class="abs" style="left:64px;top:60px;display:flex;align-items:center;gap:14px;direction:ltr;color:#fff">
    <svg width="64" height="64" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#25322B"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg>
    <span class="handle" style="font-size:30px;font-weight:850;font-stretch:125%">SUPER APP</span>
  </div>

  <svg class="abs grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .22 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
</body></html>
