<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Post 07 — اعمل دوري فانتازي لصحابك</title>
<!-- Audience: fantasy players and their crew. Goal: mentions (tag the group). Real screen: fantasy → private groups (demo data).
     The league table is a drawn example and says so. -->
<link rel="stylesheet" href="collage.css">
<style>
  .board { background: var(--surface); padding: 26px 30px 30px; box-shadow: 0 26px 34px -18px rgba(0,0,0,.6); }
  .board h3 { font-size: 36px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .board h3 small { font: 800 20px "Archivo", sans-serif; letter-spacing: .1em; color: var(--ink-2); direction: ltr; }
  .row { display: grid; grid-template-columns: 58px 1fr 110px; align-items: center; height: 74px; border-top: 2px solid #E6E8E3; font-size: 32px; font-weight: 800; }
  .row .n { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 800 24px "Archivo", sans-serif; background: #E6E8E3; }
  .row .p { font: 800 32px "Archivo", sans-serif; text-align: left; direction: ltr; }
  .row:first-child .n { background: var(--gold); color: #fff; }
  .row.last { position: relative; }
  .row.last::after { content: ""; position: absolute; inset: -6px -22px -2px; border: 7px solid var(--blaze); border-radius: 50%; transform: rotate(-2deg); }
</style></head>
<body class="bg-turf">
  <div class="abs tag" style="top:56px;right:64px"><i></i>فانتازي الدوري المصري</div>
  <div class="abs" style="left:64px;top:60px;display:flex;align-items:center;gap:14px;direction:ltr;color:#fff">
    <svg width="64" height="64" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#0D1411"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg>
    <span class="handle" style="font-size:30px;font-weight:850;font-stretch:125%">SUPER APP</span>
  </div>

  <div class="abs" style="right:64px;top:160px;display:flex;flex-direction:column;align-items:flex-start;gap:14px">
    <span class="block b-paper" style="font-size:108px;transform:rotate(-2deg)">اعمل دوري</span>
    <span class="block b-blaze" style="font-size:112px;transform:rotate(1.5deg);margin-inline-start:50px">لصحابك</span>
    <span class="note" style="font-size:42px;transform:rotate(-1deg);margin-top:6px">وعيّر <mark>اللي في الآخر</mark> كل جولة 😂</span>
  </div>

  <!-- drawn example table -->
  <div class="abs board" style="right:64px;top:640px;width:560px;transform:rotate(1.5deg)">
    <h3>دوري شلة الخميس <small>EXAMPLE</small></h3>
    <div class="rows">
      <div class="row"><span class="n">1</span><span>كريم</span><span class="p">514</span></div>
      <div class="row"><span class="n">2</span><span>زياد</span><span class="p">484</span></div>
      <div class="row"><span class="n">3</span><span>مودي</span><span class="p">462</span></div>
      <div class="row"><span class="n">4</span><span>شادي</span><span class="p">431</span></div>
      <div class="row last" id="last"><span class="n">5</span><span>عمرو</span><span class="p">312</span></div>
    </div>
  </div>
  <div class="abs" style="right:440px;top:1120px;z-index:6;transform:rotate(-6deg)"><span class="block b-ink" style="font-size:40px">ده اللي هيعزم</span></div>

  <!-- the real private-groups screen -->
  <div class="abs phone" style="left:40px;top:640px;width:380px;height:470px;transform:rotate(-4deg)">
    <div class="screen"><img src="assets/app-groups.jpg" alt=""></div>
  </div>
  <div class="abs tape" style="left:30px;top:626px;transform:rotate(-30deg)"></div>

  <div class="abs" style="right:64px;top:1220px;display:flex;align-items:center;gap:22px">
    <span class="cta" style="font-size:32px;height:76px;background:var(--ink)">منشن الشلة</span>
    <span style="color:#fff;font-size:28px;font-weight:700">مجموعة خاصة · مجانًا · بكود</span>
  </div>

  <svg class="abs grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .22 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
</body></html>
