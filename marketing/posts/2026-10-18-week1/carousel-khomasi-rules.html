<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Carousel — قواعد الخماسي اللي محدش كتبها</title>
<!-- Audience: footballers (5-a-side regulars). Goal: shares + tags. Humour from pitch culture, one soft product line on the last slide.
     Render one slide with ?s=1..6 (carousel.js renders all six). -->
<link rel="stylesheet" href="collage.css">
<style>
  .hdr { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; direction: ltr; }
  .count { height: 64px; padding: 0 24px; background: var(--ink); color: #fff; font: 800 30px "Archivo", sans-serif; letter-spacing: .06em; display: flex; align-items: center; box-shadow: 0 8px 16px -10px rgba(0,0,0,.5); }
  .swipe { position: absolute; left: 64px; bottom: 64px; display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 800; font-size: 30px; }
  .rule { position: absolute; right: 64px; top: 170px; display: flex; align-items: center; gap: 22px; }
  .rule .n { width: 150px; height: 150px; border-radius: 50%; background: var(--blaze); color: #fff; font: 800 84px "Archivo", sans-serif; display: grid; place-items: center; box-shadow: 0 16px 22px -12px rgba(0,0,0,.45); }
  .rule .lbl { font: 800 34px "Archivo", sans-serif; letter-spacing: .12em; color: var(--ink-2); direction: ltr; }
  .big { position: absolute; right: 64px; left: 64px; top: 380px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
  .art { position: absolute; left: 64px; top: 760px; width: 400px; height: 400px; }
</style></head>
<body class="bg-cream">
<div id="slide"></div>
<svg class="abs grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .22 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
<script>
const s = +new URLSearchParams(location.search).get('s') || 1, N = 6;
const mark = `<div style="display:flex;align-items:center;gap:14px"><svg width="58" height="58" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#0D1411"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg><span class="handle" style="font-size:28px;font-weight:850;font-stretch:125%">SUPER APP</span></div>`;
const hdr = `<div class="hdr">${mark}<span class="count">0${s} / 0${N}</span></div>`;
const swipe = s < N ? `<div class="swipe">اسحب<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0D1411" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></div>` : '';
const rule = (n) => `<div class="rule"><span class="n">${n}</span><span class="lbl">RULE</span></div>`;
// small drawn props, chalk-on-paper
const glove = `<svg class="art" viewBox="0 0 200 200" style="transform:rotate(-10deg)"><path d="M60 180 L60 90 Q60 70 75 70 L75 40 Q75 28 87 28 Q99 28 99 40 L99 66 L101 30 Q101 18 113 18 Q125 18 125 30 L125 68 L127 38 Q127 26 139 26 Q151 26 151 38 L151 120 Q151 180 110 180 Z" fill="#fff" stroke="#0D1411" stroke-width="6" stroke-linejoin="round"/><path d="M60 110 L40 92 Q30 84 38 74 Q46 66 56 74 L60 78" fill="#fff" stroke="#0D1411" stroke-width="6" stroke-linejoin="round"/><rect x="56" y="150" width="98" height="34" fill="#FF5B14" stroke="#0D1411" stroke-width="6"/></svg>`;
const ball = `<svg class="art" viewBox="0 0 200 200" style="transform:rotate(8deg)"><circle cx="100" cy="100" r="84" fill="#fff" stroke="#0D1411" stroke-width="7"/><path d="M100 62 L134 86 L121 126 L79 126 L66 86 Z" fill="#0D1411"/><path d="M100 62 L100 18 M134 86 L176 72 M121 126 L146 164 M79 126 L54 164 M66 86 L24 72" stroke="#0D1411" stroke-width="6"/></svg>`;
const clock = `<svg class="art" viewBox="0 0 200 200" style="transform:rotate(-6deg)"><circle cx="100" cy="106" r="80" fill="#fff" stroke="#0D1411" stroke-width="7"/><path d="M100 106 L100 56 M100 106 L140 126" stroke="#FF5B14" stroke-width="9" stroke-linecap="round"/><rect x="84" y="8" width="32" height="20" rx="4" fill="#0D1411"/><path d="M40 40 L58 58 M160 40 L142 58" stroke="#0D1411" stroke-width="7" stroke-linecap="round"/></svg>`;
const cash = `<svg class="art" viewBox="0 0 220 200" style="transform:rotate(-8deg)"><rect x="20" y="50" width="180" height="96" rx="8" fill="#E1F0E8" stroke="#0D1411" stroke-width="6" transform="rotate(-8 110 98)"/><rect x="20" y="64" width="180" height="96" rx="8" fill="#fff" stroke="#0D1411" stroke-width="6"/><circle cx="110" cy="112" r="28" fill="none" stroke="#0B6E4F" stroke-width="6"/><text x="110" y="124" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="34" fill="#0B6E4F">95</text></svg>`;
const slides = {
  1: `<div class="big" style="top:250px">
        <span class="block b-ink" style="font-size:118px;transform:rotate(-2deg)">قواعد الخماسي</span>
        <span class="block b-blaze" style="font-size:104px;transform:rotate(1.5deg);margin-inline-start:30px">اللي محدش كتبها</span>
      </div>
      <div class="abs note" style="right:64px;top:720px;font-size:44px;transform:rotate(-1.2deg)">بس <mark>الكل ماشي عليها</mark>… كل أسبوع</div>
      <div class="abs tape" style="right:360px;top:704px;transform:rotate(-5deg);width:140px"></div>
      ${ball.replace('top: 760px', '').replace('class="art"', 'class="art" style="left:90px;top:860px;width:300px;height:300px;transform:rotate(8deg)"')}`,
  2: `${rule(1)}
      <div class="big"><span class="block b-paper" style="font-size:150px;transform:rotate(-2deg)">الحارس</span><span class="block b-blaze" style="font-size:150px;transform:rotate(1.5deg);margin-inline-start:50px">بالدور</span></div>
      <div class="abs note" style="right:64px;top:820px;width:520px;font-size:40px;transform:rotate(1.5deg)">كل واحد 5 دقايق… و<mark>فجأة الكل تعبان</mark> ساعة دوره</div>${glove}`,
  3: `${rule(2)}
      <div class="big"><span class="block b-ink" style="font-size:118px;transform:rotate(-2deg)">صاحب الكورة</span><span class="block b-paper" style="font-size:130px;transform:rotate(1.5deg);margin-inline-start:50px">مبيطلعش</span></div>
      <div class="abs note" style="right:64px;top:820px;width:520px;font-size:40px;transform:rotate(-1.5deg)">حتى لو بيلعب وحش… <mark>الكورة كورته</mark></div>${ball}`,
  4: `${rule(3)}
      <div class="big"><span class="block b-blaze" style="font-size:140px;transform:rotate(-2deg)">"آخر جول</span><span class="block b-paper" style="font-size:140px;transform:rotate(1.5deg);margin-inline-start:50px">بيكسب"</span></div>
      <div class="abs note" style="right:64px;top:820px;width:520px;font-size:40px;transform:rotate(1.5deg)">حتى لو بقالكوا ساعة <mark>متغلبين 6–1</mark></div>${clock}`,
  5: `${rule(4)}
      <div class="big"><span class="block b-paper" style="font-size:118px;transform:rotate(-2deg)">"هحوّلك</span><span class="block b-ink" style="font-size:130px;transform:rotate(1.5deg);margin-inline-start:50px">بالليل"</span></div>
      <div class="abs note" style="right:64px;top:820px;width:520px;font-size:40px;transform:rotate(-1.5deg)">وبالليل ده <mark>عمره ما بييجي</mark>… والكابتن بيدفع</div>${cash}`,
  6: `<div class="big" style="top:200px"><span class="block b-ink" style="font-size:118px;transform:rotate(-2deg)">انت بتكسر</span><span class="block b-blaze" style="font-size:130px;transform:rotate(1.5deg);margin-inline-start:50px">أنهي قاعدة؟</span></div>
      <div class="abs note" style="right:64px;top:600px;width:760px;font-size:42px;transform:rotate(1deg)">منشن صاحبك اللي <mark>بيكسر القاعدة رقم 4</mark> كل أسبوع</div>
      <div class="abs" style="right:64px;left:64px;top:830px;background:var(--ink);padding:38px 44px 46px;transform:rotate(-1.2deg);box-shadow:0 22px 30px -16px rgba(0,0,0,.6)">
        <div style="color:#fff;font-size:46px;font-weight:800;line-height:1.35">قريب على Super App: <span style="color:var(--blaze)">كل واحد بيدفع نصيبه</span> وهو بينضم للماتش</div>
        <div style="color:rgba(255,255,255,.75);font-size:30px;font-weight:700;margin-top:12px">وقاعدة 4 تتلغي</div>
      </div>
      <div class="abs" style="right:64px;top:1180px"><span class="cta" style="font-size:32px;height:76px">منشن صاحبك</span></div>`,
};
document.getElementById('slide').innerHTML = hdr + slides[s] + swipe;
</script>
</body></html>
