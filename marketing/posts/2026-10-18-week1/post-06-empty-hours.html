<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Post 06 — الساعة الفاضية في ملعبك بتخسرك كام؟</title>
<!-- Audience: pitch owners (launch phase 0). Goal: messages. Real screen: partner dashboard → forecast & offers.
     All numbers are an illustrative example and say so. -->
<link rel="stylesheet" href="collage.css">
<style>
  .heat { display: grid; grid-template-columns: 70px repeat(12, 1fr); gap: 6px; font: 700 20px "Cairo", sans-serif; color: rgba(255,255,255,.7); }
  .heat i { display: block; height: 30px; border-radius: 6px; background: var(--turf); }
  .heat i.e { background: #2A3630; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
  .laptop { background: #0D1411; border-radius: 22px 22px 0 0; padding: 14px; box-shadow: 0 36px 46px -22px rgba(0,0,0,.7); border: 2px solid #2A3630; }
  .laptop img { width: 100%; display: block; border-radius: 10px; }
</style></head>
<body class="bg-ink">
  <div class="abs halftone"></div>
  <div class="abs tag" style="top:56px;right:64px"><i></i>لأصحاب الملاعب</div>
  <div class="abs" style="left:64px;top:60px;display:flex;align-items:center;gap:14px;direction:ltr;color:#fff">
    <svg width="64" height="64" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#25322B"/><svg x="8" y="8" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M17 7.2C15.9 6 14.3 5.4 12.4 5.4c-2.7 0-4.5 1.4-4.5 3.4 0 4.6 9.2 2.6 9.2 7 0 2-1.9 3.4-4.8 3.4-2.1 0-3.9-.7-5.3-2"/></svg><circle cx="24" cy="10" r="4" fill="#FF5B14"/></svg>
    <span class="handle" style="font-size:30px;font-weight:850;font-stretch:125%">SUPER APP</span>
  </div>

  <div class="abs" style="right:64px;top:150px;display:flex;flex-direction:column;align-items:flex-start;gap:14px">
    <span class="block b-paper" style="font-size:100px;transform:rotate(-2deg)">الساعة الفاضية</span>
    <span class="block b-cream" style="font-size:88px;transform:rotate(1.5deg);margin-inline-start:40px">في ملعبك</span>
    <span class="block b-blaze" style="font-size:100px;transform:rotate(-1.5deg)">بتخسرك كام؟</span>
  </div>

  <!-- the week: booked vs empty hours (afternoons are empty) -->
  <div class="abs" style="right:64px;top:560px;width:952px;background:rgba(18,26,22,.9);padding:26px 30px 30px;border:2px solid #2A3630;transform:rotate(-1deg);box-shadow:0 20px 30px -16px #000">
    <div style="display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:30px;margin-bottom:16px"><span>أسبوع في ملعب خماسي</span><span style="font-size:24px;color:rgba(255,255,255,.7)">من 2 الضهر لـ 2 بالليل</span></div>
    <div class="heat" id="heat"></div>
    <div style="display:flex;gap:22px;margin-top:16px;color:rgba(255,255,255,.8);font-size:22px;font-weight:700"><span><i style="display:inline-block;width:20px;height:20px;border-radius:5px;background:var(--turf);vertical-align:middle;margin-inline-end:8px"></i>محجوز</span><span><i style="display:inline-block;width:20px;height:20px;border-radius:5px;background:#2A3630;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);vertical-align:middle;margin-inline-end:8px"></i>فاضي</span></div>
  </div>
  <div class="abs" id="ring" style="border:7px solid var(--blaze);border-radius:26px;z-index:4"></div>

  <!-- the math (example) -->
  <div class="abs note" style="right:64px;top:965px;width:560px;font-size:36px;transform:rotate(1.5deg);line-height:56px">
    3 ساعات فاضية × 400 جنيه × 30 يوم =<br><mark style="font-size:50px;font-weight:800">36,000 جنيه</mark> في الشهر
  </div>
  <div class="abs stampbox" style="right:520px;top:1150px;z-index:10;color:var(--ink);transform:rotate(-9deg);width:140px;height:160px"><b style="font-size:44px">مثال</b><span>EXAMPLE</span></div>

  <!-- the real dashboard: forecast & offers for quiet hours -->
  <div class="abs laptop" style="left:30px;top:975px;width:470px;transform:rotate(-4deg)">
    <img src="assets/dash-insights.png" alt="">
  </div>
  <div class="abs tape" style="left:20px;top:962px;transform:rotate(-30deg)"></div>

  <div class="abs" style="right:64px;top:1240px;display:flex;flex-direction:column;align-items:flex-start;gap:10px">
    <span class="cta" style="font-size:30px;height:70px;background:var(--blaze)">ابعتلنا رسالة</span>
  </div>

  <svg class="abs grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .22 0"/></filter><rect width="1080" height="1350" filter="url(#n)"/></svg>
<script>
  // 7 days × 12 hours (2 pm → 2 am). Afternoon hours 2–5 pm are mostly empty, evenings full.
  const days = ['السبت', 'الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة'];
  const empty = (d, h) => (h < 3 && !(d === 6 && h === 2)) || (h === 11 && d < 4) || (d === 2 && h === 4);
  document.getElementById('heat').innerHTML = days.map((d, di) => `<span>${d}</span>` + Array.from({ length: 12 }, (_, h) => `<i class="${empty(di, h) ? 'e' : ''}" data-h="${h}"></i>`).join('')).join('');
  // ring the 2–5 pm columns (the empty afternoons), measured from the grid itself
  const cells = [...document.querySelectorAll('#heat i')].filter((c) => +c.dataset.h < 3).map((c) => c.getBoundingClientRect());
  const x0 = Math.min(...cells.map((r) => r.left)), x1 = Math.max(...cells.map((r) => r.right)), y0 = Math.min(...cells.map((r) => r.top)), y1 = Math.max(...cells.map((r) => r.bottom));
  Object.assign(document.getElementById('ring').style, { left: x0 - 14 + 'px', top: y0 - 8 + 'px', width: x1 - x0 + 28 + 'px', height: y1 - y0 + 18 + 'px' });
</script>
</body></html>
