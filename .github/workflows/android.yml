# Builds the Android test app (APK) in the cloud from the same site files.
# Every push to main that touches the site or the app builds a new APK and puts it on the
# "android-latest" release, so it can be downloaded straight to a phone.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'offline.html'
      - 'manifest.json'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'models/**'
      - 'icons/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy the site into the app
        run: npm run sync

      # The signing key comes from the repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Without them the build falls back to a throw-away debug key.
      - name: Signing key
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the secrets: building with a debug key (Google sign-in in the app won't work)"
          fi

      - name: Build APK (and the Play bundle when signed)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SuperMalaab.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/SuperMalaab.aab"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SuperMalaab.apk"
          fi
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: SuperApp-apk
          path: SuperMalaab.apk

      - uses: actions/upload-artifact@v4
        if: hashFiles('SuperMalaab.aab') != ''
        with:
          name: SuperMalaab-play-bundle
          path: SuperMalaab.aab

      - name: Publish to the android-latest release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Test build from ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')). Download SuperMalaab.apk on an Android phone and open it to install."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTES" --prerelease
            gh release upload android-latest SuperMalaab.apk --clobber
            gh release delete-asset android-latest SuperApp.apk -y || true   # the file's name before the rename
          else
            gh release create android-latest SuperMalaab.apk --title "Super Malaab — Android test build" --notes "$NOTES" --prerelease
          fi
