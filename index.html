      var be = document.querySelector('base'), b = (be ? be.getAttribute('href') : '/').replace(/\/$/, '');

    /* Boot splash (owner, 2026-11-23): a 3D pitch, a bouncing ball and the logo while the app loads, instead of the
       plain search-engine text. Inline so it paints at once; js/app.js removes it after the first page (12 s safety net). */
    #boot-splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden; color: #fff;
      background: radial-gradient(120% 80% at 50% 110%, #0f7a55 0%, #0a3d2c 38%, #07140f 72%); font-family: Archivo, Cairo, system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .45s ease, visibility .45s; }
    #boot-splash.bs-out { opacity: 0; visibility: hidden; }
    #boot-splash .bs-glow { position: absolute; inset: -20%; background: radial-gradient(40% 30% at 50% 35%, rgba(255,91,20,.18), transparent 70%); animation: bs-breathe 3.2s ease-in-out infinite; }
    #boot-splash .bs-wrap { position: relative; display: grid; justify-items: center; gap: 26px; perspective: 900px; }
    #boot-splash .bs-stage { position: relative; width: min(78vw, 380px); height: 210px; transform-style: preserve-3d; }
    #boot-splash .bs-pitch { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; border-radius: 10px; transform: rotateX(62deg); transform-origin: 50% 100%;
      background: repeating-linear-gradient(90deg, #138a5f 0 12.5%, #0f7b54 12.5% 25%); box-shadow: 0 40px 60px -20px rgba(0,0,0,.7), inset 0 0 40px rgba(0,0,0,.35); animation: bs-pan 6s ease-in-out infinite; }
    #boot-splash .bs-pitch svg { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
    #boot-splash .bs-ball { position: absolute; left: 50%; bottom: 40px; width: 64px; height: 64px; margin-left: -32px; animation: bs-bounce 1.1s cubic-bezier(.3,0,.7,1) infinite; }
    #boot-splash .bs-ball svg { width: 100%; height: 100%; border-radius: 50%; animation: bs-spin 1.6s linear infinite; display: block; }
    #boot-splash .bs-ball::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.75) 0 6%, rgba(255,255,255,0) 32%), radial-gradient(circle at 60% 62%, rgba(0,0,0,0) 40%, rgba(0,0,0,.45) 78%); }
    #boot-splash .bs-shadow { position: absolute; left: 50%; bottom: 30px; width: 70px; height: 16px; margin-left: -35px; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.6), transparent 70%); animation: bs-shadow 1.1s cubic-bezier(.3,0,.7,1) infinite; }
    #boot-splash .bs-brand { display: flex; align-items: center; gap: 14px; transform-style: preserve-3d; animation: bs-tilt 4s ease-in-out infinite; }
    #boot-splash .bs-mark { position: relative; width: 58px; height: 58px; border-radius: 17px; background: linear-gradient(145deg, #1f3129, #0d1411); display: grid; place-items: center;
      box-shadow: 0 1px 0 #2a3d34, 0 2px 0 #22332b, 0 3px 0 #1a2822, 0 4px 0 #131e19, 0 5px 0 #0e1612, 0 16px 26px -6px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.14); overflow: hidden; }
    #boot-splash .bs-mark::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%); transform: translateX(-120%); animation: bs-shine 2.6s ease-in-out infinite; }
    #boot-splash .bs-mark svg { width: 40px; height: 40px; }
    #boot-splash .bs-name { display: grid; line-height: 1.1; text-shadow: 0 3px 12px rgba(0,0,0,.5); }
    #boot-splash .bs-name b { font-size: 24px; font-weight: 800; letter-spacing: .06em; }
    #boot-splash .bs-name span { font-size: 15px; font-weight: 700; color: #ff8a55; font-family: Cairo, system-ui, sans-serif; }
    #boot-splash .bs-bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    #boot-splash .bs-bar i { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #FF5B14, #ffb35c); animation: bs-load 1.2s ease-in-out infinite; }
    @keyframes bs-bounce { 0%, 100% { transform: translateY(0) scale(1.08, .92); } 10% { transform: translateY(-10px) scale(1); } 50% { transform: translateY(-120px); } 90% { transform: translateY(-10px); } }
    @keyframes bs-shadow { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.45); opacity: .35; } }
    @keyframes bs-spin { to { transform: rotate(360deg); } }
    @keyframes bs-pan { 0%, 100% { transform: rotateX(62deg) rotateZ(-4deg); } 50% { transform: rotateX(62deg) rotateZ(4deg); } }
    @keyframes bs-tilt { 0%, 100% { transform: rotateY(-14deg) rotateX(6deg); } 50% { transform: rotateY(14deg) rotateX(-4deg); } }
    @keyframes bs-shine { 0%, 40% { transform: translateX(-120%); } 80%, 100% { transform: translateX(120%); } }
    @keyframes bs-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes bs-breathe { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot-splash *, #boot-splash *::before, #boot-splash *::after { animation: none !important; } }
